<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Repuestos Sotomayor 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- Three.js r128 & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            touch-action: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .hud-glass {
            background: rgba(15, 23, 42, 0.58);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }
        .hud-modal {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
        }
        .ctrl-btn {
            transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
            touch-action: none;
        }
        .ctrl-btn:active, .ctrl-btn.pressed {
            transform: scale(0.90);
            background: rgba(255, 255, 255, 0.28);
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.65); }
            50% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
        }
        .glow-ready {
            animation: pulseGlow 1.5s infinite;
        }
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            height: 5px;
            border-radius: 999px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #22c55e;
            cursor: pointer;
            border: 2px solid #ffffff;
        }
    </style>
</head>
<body class="text-slate-100 antialiased">

    <!-- 3D WebGL Viewport -->
    <div id="canvas-container"></div>

    <!-- BOTÓN FLOTANTE PARA RESTAURAR HUD CUANDO ESTÁ OCULTO -->
    <button id="btn-restore-hud" onclick="toggleCleanHud(false)" class="hidden fixed top-3 right-3 z-50 w-9 h-9 rounded-full hud-glass flex items-center justify-center text-sm text-white pointer-events-auto">
        👁️
    </button>

    <!-- CONTENEDOR PRINCIPAL DEL HUD MINIMALISTA -->
    <div id="hud-root" class="fixed inset-0 z-20 pointer-events-none">

        <!-- ESQUINA SUPERIOR IZQUIERDA: MINI-RADAR GPS ULTRA-COMPACTO -->
        <div class="absolute top-2.5 left-2.5 pointer-events-auto flex flex-col items-start gap-1">
            <div onclick="cycleNextVehicleQuick()" title="Toca para cambiar de vehículo" class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-2xl hud-glass overflow-hidden cursor-pointer border border-white/20 active:scale-95 transition">
                <canvas id="minimap-canvas" width="120" height="120" class="w-full h-full block"></canvas>
                <!-- Velocímetro compacto integrado en el borde del radar -->
                <div class="absolute bottom-1 left-1.5 right-1.5 flex items-center justify-between text-[9px] font-black font-mono text-white drop-shadow">
                    <span id="hud-speed">0 km/h</span>
                    <span id="hud-mode-dot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
                </div>
            </div>
        </div>

        <!-- ESQUINA SUPERIOR DERECHA: SOLO 3 BOTONES CIRCULARES LIMPIOS -->
        <div class="absolute top-2.5 right-2.5 flex items-center gap-1.5 pointer-events-auto">
            <!-- 1. Ir al Mostrador con Gonzalo -->
            <button onclick="focusGonzaloCounter()" title="Mostrador / Gonzalo" class="ctrl-btn w-9 h-9 sm:w-10 sm:h-10 rounded-full hud-glass flex items-center justify-center text-base">
                🏪
            </button>
            <!-- 2. Alternar Cámara Seguimiento / Libre -->
            <button id="btn-chase-cam" onclick="toggleChaseCam()" title="Cámara Seguimiento / Libre" class="ctrl-btn w-9 h-9 sm:w-10 sm:h-10 rounded-full hud-glass border-emerald-400/60 flex items-center justify-center text-base">
                🎥
            </button>
            <!-- 3. Abrir Menú Compacto -->
            <button id="btn-settings" onclick="toggleSettingsDrawer()" title="Opciones y Vehículos" class="ctrl-btn w-9 h-9 sm:w-10 sm:h-10 rounded-full hud-glass flex items-center justify-center text-base">
                ⚙️
            </button>
        </div>

        <!-- MENÚ PLEGABLE (OCULTO POR DEFECTO, CERO RUIDO EN PANTALLA) -->
        <div id="settings-drawer" class="hidden absolute top-14 right-2.5 w-60 hud-modal rounded-2xl p-3 space-y-2.5 pointer-events-auto">
            <div class="flex items-center justify-between border-b border-white/10 pb-1.5">
                <span class="text-[11px] font-extrabold uppercase tracking-wider text-slate-300">Menú Rápido</span>
                <button onclick="toggleSettingsDrawer()" class="text-xs text-slate-400 hover:text-white font-bold px-1">✕</button>
            </div>

            <!-- Selector de Vehículo o Modo Peatón -->
            <div>
                <label class="text-[9px] font-bold uppercase text-slate-400 block mb-1">Vehículo / Personaje</label>
                <select id="vehicle-select" onchange="selectVehicleById(this.value); toggleSettingsDrawer();" class="w-full bg-slate-900/95 text-xs font-bold text-white px-2.5 py-1.5 rounded-xl border border-slate-700 outline-none">
                    <option value="willys">🚙 Jeep Willys CJ-2A</option>
                    <option value="bera_gr250">🏍️ Moto Bera GR 250</option>
                    <option value="suv_4runner">🚙 Toyota 4Runner 2012</option>
                    <option value="hilux_blue">🛻 Hilux Kavak 2012 4x4</option>
                    <option value="ranger_white">🛻 Ford Ranger 1999 XLT</option>
                    <option value="truck_ibc">🚛 Camión 350 IBC</option>
                    <option value="on_foot">🚶 Caminar a Pie</option>
                </select>
            </div>

            <!-- Vistas Rápidas -->
            <div>
                <label class="text-[9px] font-bold uppercase text-slate-400 block mb-1">Cámara</label>
                <div class="grid grid-cols-2 gap-1">
                    <button onclick="setQuickCamera('facade'); toggleSettingsDrawer();" class="py-1 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-[10px] font-bold text-slate-200">📸 Fachada</button>
                    <button onclick="focusGonzaloCounter(); toggleSettingsDrawer();" class="py-1 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-[10px] font-bold text-amber-300">🧢 Gonzalo</button>
                    <button onclick="setQuickCamera('street'); toggleSettingsDrawer();" class="py-1 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-[10px] font-bold text-slate-200">🛣️ Avenida</button>
                    <button onclick="setQuickCamera('drone'); toggleSettingsDrawer();" class="py-1 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-[10px] font-bold text-slate-200">🚁 Aérea</button>
                </div>
            </div>

            <!-- Hora del Sol -->
            <div class="space-y-1">
                <div class="flex justify-between text-[10px]">
                    <span class="text-slate-300 font-semibold">☀️ Hora del Día</span>
                    <span id="sun-time-label" class="font-mono text-amber-400 font-bold">14:30</span>
                </div>
                <input id="sun-slider" type="range" min="6" max="20" step="0.25" value="14.5" oninput="updateSunTime(this.value)" class="w-full">
            </div>

            <!-- Acciones Rápidas -->
            <div class="grid grid-cols-2 gap-1.5 pt-1 border-t border-white/10">
                <button onclick="cycleGateState()" id="btn-gate-label" class="py-1.5 px-2 rounded-xl bg-emerald-600/30 border border-emerald-500/40 text-[10px] font-bold text-emerald-200">
                    🚪 Portón: Abierto
                </button>
                <button onclick="toggleLightsQuick()" id="btn-lights-label" class="py-1.5 px-2 rounded-xl bg-amber-500/20 border border-amber-500/40 text-[10px] font-bold text-amber-200">
                    💡 Luces: OFF
                </button>
                <button onclick="toggleDioramaMode()" id="btn-diorama-label" class="py-1.5 px-2 rounded-xl bg-slate-800 border border-slate-600 text-[10px] font-bold text-slate-200">
                    🎨 Maqueta: OFF
                </button>
                <button onclick="toggleFullscreen()" class="py-1.5 px-2 rounded-xl bg-slate-800 border border-slate-600 text-[10px] font-bold text-slate-200">
                    ⛶ Pantalla Comp.
                </button>
            </div>

            <button onclick="toggleCleanHud(true)" class="w-full py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-[10px] font-bold text-sky-300 border border-sky-500/30">
                👁️ Ocultar Controles (Vista Limpia)
            </button>
        </div>

        <!-- TARJETA COMPACTA DE DIÁLOGO DE GONZALO (SOLO AL HABLAR CON ÉL) -->
        <div id="gonzalo-toast" class="hidden absolute top-14 left-1/2 -translate-x-1/2 w-[88vw] max-w-xs hud-modal rounded-2xl p-3 pointer-events-auto border border-amber-400/50">
            <div class="flex items-center justify-between mb-1">
                <div class="flex items-center gap-1.5">
                    <span class="text-sm">🧢</span>
                    <span class="text-xs font-black text-amber-300">Gonzalo • Mostrador</span>
                </div>
                <button onclick="closeGonzaloToast()" class="text-xs text-slate-400 hover:text-white font-bold px-1">✕</button>
            </div>
            <p id="gonzalo-speech" class="text-[11px] text-slate-100 leading-snug mb-2">
                "¡Bienvenido a Repuestos Sotomayor! Tenemos tren delantero MOOG, anillos Hastings, partes de motor Sealed Power, clutch LuK y aceite 20W-50."
            </p>
            <div class="flex items-center justify-between gap-1">
                <button onclick="nextGonzaloSpeech()" class="flex-1 py-1 px-2 rounded-lg bg-amber-500/20 border border-amber-400/50 text-amber-200 text-[10px] font-bold">
                    💬 Consultar otro repuesto
                </button>
                <button onclick="walkInsideCounter()" class="py-1 px-2 rounded-lg bg-emerald-600/30 border border-emerald-400/50 text-emerald-200 text-[10px] font-bold">
                    🚶 Entrar
                </button>
            </div>
        </div>

        <!-- ESQUINA INFERIOR IZQUIERDA: JOYSTICK VIRTUAL LIMPIO (SIN ETIQUETAS RUIDOSAS) -->
        <div id="joystick-zone" class="absolute bottom-3.5 left-3.5 w-24 h-24 sm:w-28 sm:h-28 rounded-full hud-glass flex items-center justify-center pointer-events-auto touch-none">
            <div class="w-10 h-10 rounded-full border border-white/15 pointer-events-none"></div>
            <div id="joystick-knob" class="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-white/80 border-2 border-white shadow-md pointer-events-none transition-transform duration-75"></div>
        </div>

        <!-- ESQUINA INFERIOR DERECHA: BOTONES TÁCTILES REDONDOS Y DISCRETOS -->
        <div class="absolute bottom-3.5 right-3.5 flex items-end gap-2.5 pointer-events-auto">
            <!-- Columna Secundaria: Subir/Bajar [E] y Freno/Saltar -->
            <div class="flex flex-col items-center gap-2">
                <!-- Botón Contextual Subir / Bajar / Hablar con Gonzalo -->
                <button id="btn-action-e" onclick="triggerContextualAction()" title="Subir / Bajar [E]" class="ctrl-btn w-11 h-11 sm:w-12 sm:h-12 rounded-full hud-glass border-2 border-amber-400/70 flex items-center justify-center text-lg shadow-lg">
                    <span id="action-e-icon">🚶</span>
                </button>

                <!-- Botón Freno de Mano (en carro) / Correr-Saltar (a pie) -->
                <button id="btn-brake-jump"
                    onmousedown="setHoldInput('brake', true)" onmouseup="setHoldInput('brake', false)" onmouseleave="setHoldInput('brake', false)"
                    ontouchstart="setHoldInput('brake', true); event.preventDefault();" ontouchend="setHoldInput('brake', false)"
                    class="ctrl-btn w-11 h-11 sm:w-12 sm:h-12 rounded-full hud-glass flex items-center justify-center text-sm font-bold text-slate-200">
                    <span id="brake-jump-icon">🛑</span>
                </button>
            </div>

            <!-- Columna de Pedales (Visible solo al conducir; a pie el joystick ya camina solo) -->
            <div id="driving-pedals" class="flex items-end gap-2">
                <!-- Reversa / Frenar -->
                <button id="pedal-rev"
                    onmousedown="setHoldInput('backward', true)" onmouseup="setHoldInput('backward', false)" onmouseleave="setHoldInput('backward', false)"
                    ontouchstart="setHoldInput('backward', true); event.preventDefault();" ontouchend="setHoldInput('backward', false)"
                    class="ctrl-btn w-12 h-12 sm:w-13 sm:h-13 rounded-full hud-glass border-red-400/50 bg-red-600/35 flex items-center justify-center text-base font-black text-white">
                    ▼
                </button>
                <!-- Acelerar -->
                <button id="pedal-gas"
                    onmousedown="setHoldInput('forward', true)" onmouseup="setHoldInput('forward', false)" onmouseleave="setHoldInput('forward', false)"
                    ontouchstart="setHoldInput('forward', true); event.preventDefault();" ontouchend="setHoldInput('forward', false)"
                    class="ctrl-btn w-14 h-14 sm:w-16 sm:h-16 rounded-full hud-glass border-2 border-emerald-400/80 bg-emerald-600/45 flex items-center justify-center text-xl font-black text-white shadow-lg">
                    ▲
                </button>
            </div>
        </div>

    </div>

    <script>
        // ============================================================================
        // 1. ESTADO GLOBAL Y CONFIGURACIÓN
        // ============================================================================
        let scene, camera, renderer, controls, clock;
        let ambientLight, hemiLight, sunLight;
        let sotomayorGroup, neighborsGroup, polesGroup, urbanGroundGroup, dioramaGroup;
        let leftGatePivot, leftFoldDoor, rightFoldDoor, willysWindshieldPivot;

        // Portón abierto por defecto para ver el interior del mostrador y a Gonzalo
        let gateState = 'open'; // 'open' | 'photo' | 'closed'
        let targetGateAngle = Math.PI * 0.82;
        let currentGateAngle = Math.PI * 0.82;
        let targetFoldScale = 0.12;
        let currentFoldScale = 0.12;

        let chaseCamEnabled = true;
        let nightLightsEnabled = false;
        let isDioramaMode = false;

        const shopSpotLights = [];
        const vehicleHeadlights = [];
        const emissiveMaterials = [];
        const obstacleBoxes = [];

        // Estado Multi-Vehículo y Peatón
        let controlMode = 'driving'; // 'driving' | 'on_foot'
        const drivableVehicles = [];
        let activeVehicle = null;
        let nearbyVehicle = null;
        let nearGonzaloCounter = false;

        // NPC Gonzalo sentado en el mostrador de Repuestos Sotomayor
        const gonzaloNPC = {
            group: null,
            headGroup: null,
            worldX: -1.35,
            worldZ: -1.95
        };

        const gonzaloQuotes = [
            "\"¡Bienvenido a Repuestos Sotomayor! Aquí en el mostrador tenemos tren delantero MOOG, anillos Hastings, partes de motor Sealed Power y aceite 20W-50.\"",
            "\"¿Buscas rodamientos o embrague? Tenemos estopera y rodamientos Timken, kits de clutch LuK y amortiguadores Monroe listos para entregar.\"",
            "\"Debajo del mural del Jeep tengo los galones de refrigerante ACDelco, Mopar y cajas de aceite 20W-50. ¡Pregunta con confianza!\"",
            "\"Esa Bera GR 250 y el Willys lucen impecables frente al local. Cualquier repuesto LGP o Elgin que necesites, aquí lo ubicamos al instante.\""
        ];
        let gonzaloQuoteIndex = 0;

        // Entradas de Teclado + Joystick Táctil
        const inputState = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            brake: false,
            sprint: false,
            joyX: 0,
            joyY: 0,
            joyActive: false
        };

        // Personaje Principal Articulado
        const character = {
            root: null,
            hips: null,
            torso: null,
            head: null,
            leftArm: null,
            rightArm: null,
            leftLeg: null,
            rightLeg: null,
            leftKnee: null,
            rightKnee: null,
            footRing: null,
            x: 1.85,
            y: 0,
            z: 5.25,
            vy: 0,
            heading: 0.48,
            speed: 0,
            walkPhase: 0
        };

        // ============================================================================
        // 2. GENERADORES DE TEXTURAS PROCEDURALES
        // ============================================================================
        function createBrickTextures(repeatX, repeatY) {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');

            const bCanvas = document.createElement('canvas');
            bCanvas.width = 512; bCanvas.height = 512;
            const bCtx = bCanvas.getContext('2d');

            ctx.fillStyle = '#c8beb4';
            ctx.fillRect(0, 0, 512, 512);
            bCtx.fillStyle = '#383838';
            ctx.fillRect(0, 0, 512, 512);

            const rows = 16, cols = 8;
            const bW = 512 / cols, bH = 512 / rows, mortar = 3.5;
            const palette = ['#b85236', '#c45b3e', '#a9482e', '#cc6447', '#9e4229', '#bf563a'];

            for (let r = 0; r < rows; r++) {
                const offset = (r % 2) * (bW * 0.5);
                for (let col = -1; col <= cols; col++) {
                    const x = col * bW + offset;
                    const y = r * bH;
                    ctx.fillStyle = palette[(r * 7 + col * 3 + 10) % palette.length];
                    ctx.fillRect(x + mortar * 0.5, y + mortar * 0.5, bW - mortar, bH - mortar);
                    bCtx.fillStyle = '#dcdcdc';
                    bCtx.fillRect(x + mortar * 0.5, y + mortar * 0.5, bW - mortar, bH - mortar);
                }
            }

            const colorTex = new THREE.CanvasTexture(c);
            colorTex.wrapS = colorTex.wrapT = THREE.RepeatWrapping;
            colorTex.repeat.set(repeatX, repeatY);

            const bumpTex = new THREE.CanvasTexture(bCanvas);
            bumpTex.wrapS = bumpTex.wrapT = THREE.RepeatWrapping;
            bumpTex.repeat.set(repeatX, repeatY);

            return { map: colorTex, bumpMap: bumpTex };
        }

        function createAsphaltTexture() {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#333942';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 3500; i++) {
                const v = 42 + Math.floor(Math.random() * 28);
                ctx.fillStyle = `rgb(${v},${v + 2},${v + 5})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(18, 18);
            return tex;
        }

        function createConcreteTexture() {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 1200; i++) {
                const v = 185 + Math.floor(Math.random() * 40);
                ctx.fillStyle = `rgb(${v},${v},${v - 3})`;
                ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(6, 6);
            return tex;
        }

        function createBrandPlaqueTexture(type) {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 256;
            const ctx = c.getContext('2d');

            if (type === 'SEALED_POWER') {
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 512, 256);
                ctx.fillStyle = '#dc2626';
                ctx.beginPath(); ctx.arc(100, 128, 68, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#0f172a';
                ctx.font = 'italic 900 62px Inter, sans-serif';
                ctx.fillText('SEALED', 185, 118);
                ctx.fillText('POWER', 185, 188);
            } else if (type === 'HASTINGS') {
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 512, 256);
                ctx.fillStyle = '#eab308'; ctx.fillRect(16, 48, 95, 160);
                ctx.fillStyle = '#1d4ed8';
                ctx.font = 'italic 900 66px Inter, sans-serif';
                ctx.fillText('HASTINGS', 128, 142);
                ctx.fillStyle = '#475569';
                ctx.font = 'bold 34px Inter, sans-serif';
                ctx.fillText('Piston Rings', 240, 198);
            } else if (type === 'LGP') {
                ctx.fillStyle = '#ea580c'; ctx.fillRect(0, 0, 512, 256);
                ctx.fillStyle = '#1e293b';
                ctx.font = '900 135px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('LGP', 256, 165);
                ctx.font = 'bold 24px Inter, sans-serif';
                ctx.fillText('LINDECO GENUINE POWERSPORTS', 256, 222);
            } else if (type === 'ELGIN') {
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 512, 256);
                ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 12; ctx.strokeRect(10, 10, 492, 236);
                ctx.fillStyle = '#ea580c';
                ctx.font = 'italic 900 94px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ELGIN', 256, 138);
                ctx.fillStyle = '#0369a1';
                ctx.font = 'bold 38px Inter, sans-serif';
                ctx.fillText('I N D U S T R I E S', 256, 205);
            } else if (type === 'TIMKEN') {
                ctx.fillStyle = '#111827'; ctx.fillRect(0, 0, 512, 256);
                ctx.fillStyle = '#f97316';
                ctx.font = '900 92px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('TIMKEN', 256, 162);
            } else if (type === 'MOOG') {
                ctx.fillStyle = '#1d4ed8'; ctx.fillRect(0, 0, 512, 256);
                ctx.fillStyle = '#facc15';
                ctx.font = '900 108px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('MOOG', 256, 166);
            } else if (type === 'LUK') {
                ctx.fillStyle = '#facc15'; ctx.fillRect(0, 0, 512, 256);
                ctx.strokeStyle = '#111827'; ctx.lineWidth = 18; ctx.strokeRect(14, 14, 484, 228);
                ctx.fillStyle = '#111827';
                ctx.font = '900 145px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('LuK', 256, 178);
            } else if (type === 'MONROE') {
                ctx.fillStyle = '#111827'; ctx.fillRect(0, 0, 512, 256);
                ctx.fillStyle = '#facc15';
                ctx.font = 'italic 900 84px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('MONROE', 256, 158);
            }
            return new THREE.CanvasTexture(c);
        }

        function createGateTallBannerTexture() {
            const c = document.createElement('canvas');

        function addWheelsToVehicle(group, radius, width, rimHex, coords) {
            const wheels = [];
            const steerPivots = [];
            const tireMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.85 });
            const rimMat = new THREE.MeshStandardMaterial({ color: rimHex, metalness: 0.4, roughness: 0.35 });

            coords.forEach(([x, y, z, isFront]) => {
                const pivot = new THREE.Group();
                pivot.position.set(x, y, z);
                const wMesh = new THREE.Group();

                const tire = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, width, 18), tireMat);
                tire.rotation.z = Math.PI / 2;
                wMesh.add(tire);

                const rim = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.58, radius * 0.58, width + 0.02, 12), rimMat);
                rim.rotation.z = Math.PI / 2;
                wMesh.add(rim);

                pivot.add(wMesh);
                group.add(pivot);
                wheels.push(wMesh);
                if (isFront) steerPivots.push(pivot);
            });
            return { wheels, steerPivots };
        }

        function registerDrivable(id, name, mesh, x, z, heading, maxSpeed, seatOffset, isBike = false) {
            mesh.position.set(x, 0, z);
            mesh.rotation.y = heading;
            scene.add(mesh);

            const ring = new THREE.Mesh(
                new THREE.RingGeometry(isBike ? 1.0 : 1.8, isBike ? 1.25 : 2.15, 28),
                new THREE.MeshBasicMaterial({ color: 0x22c55e, side: THREE.DoubleSide, transparent: true, opacity: 0.8 })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 0.04;
            ring.visible = false;
            mesh.add(ring);

            const v = {
                id, name, mesh, x, z, heading,
                speed: 0, maxSpeed, steerAngle: 0,
                seatOffset, isBike, ring,
                wheels: mesh.userData.wheels || [],
                steerPivots: mesh.userData.steerPivots || []
            };
            drivableVehicles.push(v);
            return v;
        }

        function toggleCleanHud(hide) {

            chaseCamEnabled = !chaseCamEnabled;
            const btn = document.getElementById('btn-chase-cam');
            btn.classList.toggle('border-emerald-400/60', chaseCamEnabled);
        }

        function selectVehicleById(id) {
            if (id === 'on_foot') {
                if (controlMode === 'driving' && activeVehicle) {
                    character.x = activeVehicle.x - Math.cos(activeVehicle.heading) * 2.1;
                    character.z = activeVehicle.z + Math.sin(activeVehicle.heading) * 2.1;
                    character.heading = activeVehicle.heading;
                }
                controlMode = 'on_foot';
                updateMinimalHudState();
                return;
            }
            const found = drivableVehicles.find(v => v.id === id);
            if (found) {
                activeVehicle = found;
                controlMode = 'driving';
                updateMinimalHudState();
            }
        }

        function cycleNextVehicleQuick() {
            if (controlMode === 'on_foot') {
                selectVehicleById(drivableVehicles[0].id);
                return;
            }
            const idx = drivableVehicles.indexOf(activeVehicle);
            const nextIdx = (idx + 1) % (drivableVehicles.length + 1);
            if (nextIdx === drivableVehicles.length) {
                selectVehicleById('on_foot');
            } else {
                selectVehicleById(drivableVehicles[nextIdx].id);
            }
        }

        function updateMinimalHudState() {
            const sel = document.getElementById('vehicle-select');
            const pedals = document.getElementById('driving-pedals');
            const eIcon = document.getElementById('action-e-icon');
            const brakeIcon = document.getElementById('brake-jump-icon');
            const dot = document.getElementById('hud-mode-dot');

            if (controlMode === 'on_foot') {
                sel.value = 'on_foot';
                pedals.classList.add('hidden');
                eIcon.textContent = '🚙';
                brakeIcon.textContent = '⏫';
                dot.className = 'w-2 h-2 rounded-full bg-amber-400';
            } else {
                sel.value = activeVehicle.id;
                pedals.classList.remove('hidden');
                eIcon.textContent = '🚶';
                brakeIcon.textContent = '🛑';
                dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
            }
        }

        function triggerContextualAction() {
            if (nearGonzaloCounter) {
                focusGonzaloCounter();
                return;
            }
            if (controlMode === 'driving') {
                selectVehicleById('on_foot');
            } else if (nearbyVehicle) {
                selectVehicleById(nearbyVehicle.id);
            } else if (activeVehicle) {
                selectVehicleById(activeVehicle.id);
            }
        }

        function updateSunTime(val) {
            const num = parseFloat(val);
            const hh = Math.floor(num);
            const mm = Math.round((num - hh) * 60).toString().padStart(2, '0');
            document.getElementById('sun-time-label').textContent = `${hh}:${mm}`;
            const isNight = num < 6.8 || num > 18.5;
            scene.background.setHex(isNight ? 0x09101d : 0x7dd3fc);
            sunLight.intensity = isNight ? 0.2 : 1.15;
        }

        // ============================================================================
        // 7. JOYSTICK VIRTUAL, TECLADO Y BUCLE PRINCIPAL DE ANIMACIÓN
        // ============================================================================
        function setupInputListeners() {
            window.addEventListener('keydown', e => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') inputState.forward = true;
                if (k === 's' || e.key === 'ArrowDown') inputState.backward = true;
                if (k === 'a' || e.key === 'ArrowLeft') inputState.left = true;
                if (k === 'd' || e.key === 'ArrowRight') inputState.right = true;
                if (e.key === ' ') inputState.brake = true;
                if (e.key === 'Shift') inputState.sprint = true;
                if (k === 'e' || k === 'f') triggerContextualAction();
            });

            window.addEventListener('keyup', e => {
                const k = e.key.toLowerCase();
                if (k === 'w' || e.key === 'ArrowUp') inputState.forward = false;
                if (k === 's' || e.key === 'ArrowDown') inputState.backward = false;
                if (k === 'a' || e.key === 'ArrowLeft') inputState.left = false;
                if (k === 'd' || e.key === 'ArrowRight') inputState.right = false;
                if (e.key === ' ') inputState.brake = false;
                if (e.key === 'Shift') inputState.sprint = false;
            });

            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let activeTouchId = null;
            const maxR = 34;

            const moveJoy = (cx, cy) => {
                const rect = zone.getBoundingClientRect();
                let dx = cx - (rect.left + rect.width / 2);
                let dy = cy - (rect.top + rect.height / 2);
                const dist = Math.hypot(dx, dy);
                if (dist > maxR) {
                    dx = (dx / dist) * maxR;
                    dy = (dy / dist) * maxR;
                }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                inputState.joyX = dx / maxR;
                inputState.joyY = dy / maxR;
                inputState.joyActive = dist > 4;
            };

            const resetJoy = () => {
                activeTouchId = null;
                knob.style.transform = 'translate(0px, 0px)';
                inputState.joyX = 0;
                inputState.joyY = 0;
                inputState.joyActive = false;
            };

            zone.addEventListener('touchstart', e => {
                e.preventDefault();
                const t = e.changedTouches[0];
                activeTouchId = t.identifier;
                moveJoy(t.clientX, t.clientY);
            }, { passive: false });

            zone.addEventListener('touchmove', e => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        moveJoy(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                    }
                }
            }, { passive: false });

            zone.addEventListener('touchend', resetJoy);
            zone.addEventListener('touchcancel', resetJoy);
        }

        function updateSimulation(dt) {
            currentGateAngle += (targetGateAngle - currentGateAngle) * 0.1;
            currentFoldScale += (targetFoldScale - currentFoldScale) * 0.1;
            if (leftGatePivot) leftGatePivot.rotation.y = -currentGateAngle;
            if (leftFoldDoor) leftFoldDoor.scale.x = currentFoldScale;

            if (gonzaloNPC.headGroup) {
                gonzaloNPC.headGroup.rotation.y = Math.sin(performance.now() * 0.0016) * 0.18;
            }

            const throttle = (inputState.forward ? 1 : 0) - (inputState.backward ? 1 : 0) + (inputState.joyActive ? -inputState.joyY : 0);
            const steer = (inputState.left ? 1 : 0) - (inputState.right ? 1 : 0) + (inputState.joyActive ? -inputState.joyX : 0);

            if (controlMode === 'driving' && activeVehicle) {
                const v = activeVehicle;
                if (Math.abs(throttle) > 0.08) {
                    v.speed += Math.max(-1, Math.min(1, throttle)) * 18 * dt;
                } else {
                    v.speed *= Math.pow(0.22, dt);
                }
                if (inputState.brake) v.speed *= Math.pow(0.02, dt);
                v.speed = Math.max(-v.maxSpeed * 0.45, Math.min(v.maxSpeed, v.speed));

                const targetSteer = Math.max(-1, Math.min(1, steer)) * 0.52;
                v.steerAngle += (targetSteer - v.steerAngle) * 0.18;

                if (Math.abs(v.speed) > 0.1) {
                    const dir = v.speed >= 0 ? 1 : -1;
                    v.heading += v.steerAngle * dir * Math.min(1, Math.abs(v.speed) / 4) * 1.9 * dt;
                    v.x += Math.sin(v.heading) * v.speed * dt;
                    v.z += Math.cos(v.heading) * v.speed * dt;
                }

                v.x = Math.max(-65, Math.min(65, v.x));
                v.z = Math.max(-2.2, Math.min(45, v.z));
                v.mesh.position.set(v.x, 0, v.z);
                v.mesh.rotation.y = v.heading;

                v.wheels.forEach(w => { w.rotation.x += v.speed * dt * 2.2; });
                v.steerPivots.forEach(p => { p.rotation.y = v.steerAngle; });

                if (v.isBike && v.mesh.userData.bikeLeanGroup) {
                    const lean = -v.steerAngle * (Math.abs(v.speed) / v.maxSpeed) * 0.65;
                    v.mesh.userData.bikeLeanGroup.rotation.z += (lean - v.mesh.userData.bikeLeanGroup.rotation.z) * 0.15;
                }

                const cosH = Math.cos(v.heading), sinH = Math.sin(v.heading);
                const so = v.seatOffset;
                character.root.position.set(
                    v.x + so.x * cosH + so.z * sinH,
                    so.y,
                    v.z - so.x * sinH + so.z * cosH
                );
                character.root.rotation.y = v.heading;
                character.leftLeg.rotation.x = -1.1;
                character.rightLeg.rotation.x = -1.1;

                document.getElementById('hud-speed').textContent = `${Math.round(Math.abs(v.speed) * 3.6)} km/h`;

                if (chaseCamEnabled) {
                    const dist = v.isBike ? 6.2 : 8.5;
                    const height = v.isBike ? 2.8 : 3.6;
                    camera.position.lerp(new THREE.Vector3(v.x - Math.sin(v.heading) * dist, height, v.z - Math.cos(v.heading) * dist), 0.08);
                    controls.target.lerp(new THREE.Vector3(v.x, 1.3, v.z), 0.12);
                }
            } else {
                const maxWalk = (inputState.sprint || inputState.brake) ? 7.2 : 4.5;
                if (inputState.joyActive) {
                    character.heading -= inputState.joyX * 2.6 * dt;
                    character.speed = -inputState.joyY * maxWalk;
                } else {
                    character.heading += steer * 2.6 * dt;
                    character.speed = throttle * maxWalk;
                }

                character.x += Math.sin(character.heading) * character.speed * dt;
                character.z += Math.cos(character.heading) * character.speed * dt;
                character.x = Math.max(-65, Math.min(65, character.x));
                character.z = Math.max(-5.6, Math.min(45, character.z));

                character.root.position.set(character.x, character.y, character.z);
                character.root.rotation.y = character.heading;

                if (Math.abs(character.speed) > 0.15) {
                    character.walkPhase += dt * Math.abs(character.speed) * 2.4;
                    const sw = Math.sin(character.walkPhase) * 0.65;
                    character.leftLeg.rotation.x = sw;
                    character.rightLeg.rotation.x = -sw;
                    character.leftArm.rotation.x = -sw * 0.8;
                    character.rightArm.rotation.x = sw * 0.8;
                } else {
                    character.leftLeg.rotation.x = 0;
                    character.rightLeg.rotation.x = 0;
                }

                document.getElementById('hud-speed').textContent = `${Math.round(Math.abs(character.speed) * 3.6)} km/h`;

                if (chaseCamEnabled) {
                    camera.position.lerp(new THREE.Vector3(character.x - Math.sin(character.heading) * 4.5, 2.3, character.z - Math.cos(character.heading) * 4.5), 0.1);
                    controls.target.lerp(new THREE.Vector3(character.x, 1.3, character.z), 0.15);
                }
            }

            // Detección silenciosa de cercanía (solo ilumina el botón redondo #btn-action-e sin carteles ruidosos)
            const px = controlMode === 'on_foot' ? character.x : activeVehicle.x;
            const pz = controlMode === 'on_foot' ? character.z : activeVehicle.z;
            nearGonzaloCounter = Math.hypot(px - (-2.2), pz - (-3.0)) < 3.5;

            nearbyVehicle = null;
            drivableVehicles.forEach(v => { v.ring.visible = false; });
            if (controlMode === 'on_foot') {
                let minD = 4.2;
                drivableVehicles.forEach(v => {
                    const d = Math.hypot(px - v.x, pz - v.z);
                    if (d < minD) {
                        minD = d;
                        nearbyVehicle = v;
                    }
                });
                if (nearbyVehicle) nearbyVehicle.ring.visible = true;
            }

            const btnE = document.getElementById('btn-action-e');
            const eIcon = document.getElementById('action-e-icon');
            if (nearGonzaloCounter) {
                eIcon.textContent = '🧢';
                btnE.classList.add('glow-ready');
            } else if (controlMode === 'on_foot' && nearbyVehicle) {
                eIcon.textContent = nearbyVehicle.isBike ? '🏍️' : '🚙';
                btnE.classList.add('glow-ready');
            } else {
                eIcon.textContent = controlMode === 'on_foot' ? '🚙' : '🚶';
                btnE.classList.remove('glow-ready');
            }
        }

        function drawMinimap() {
            const c = document.getElementById('minimap-canvas');
            if (!c) return;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#09131c';
            ctx.fillRect(0, 0, c.width, c.height);

            const cx = c.width / 2, cy = c.height * 0.42, scale = 1.65;
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, cy + 4, c.width, 32);

            ctx.fillStyle = '#b91c1c';
            ctx.fillRect(cx - 10, cy - 15, 20, 15);

            drivableVehicles.forEach(v => {
                ctx.fillStyle = (controlMode === 'driving' && v === activeVehicle) ? '#22c55e' : '#38bdf8';
                ctx.fillRect(cx + v.x * scale - 2.5, cy + v.z * scale - 2.5, 5, 5);
            });

            if (controlMode === 'on_foot') {
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(cx + character.x * scale, cy + character.z * scale, 3.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7dd3fc);
            scene.fog = new THREE.FogExp2(0x7dd3fc, 0.006);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 300);
            camera.position.set(-2.5, 3.5, 11.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;

            renderer.domElement.addEventListener('pointerdown', () => {
                if (chaseCamEnabled) {
                    chaseCamEnabled = false;
                    document.getElementById('btn-chase-cam').classList.remove('border-emerald-400/60');
                }
            });

            ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
            scene.add(ambientLight);

            hemiLight = new THREE.HemisphereLight(0xe0f2fe, 0x334155, 0.5);
            scene.add(hemiLight);

            sunLight = new THREE.DirectionalLight(0xfffbeb, 1.15);
            sunLight.position.set(18, 32, 22);
            sunLight.castShadow = true;
            scene.add(sunLight);

            buildSotomayorBuilding();
            buildSurroundingStreets();
            buildDioramaBase();
            buildCharacter();
            buildFleet();
            setupInputListeners();
            updateMinimalHudState();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const dt = Math.min(0.05, clock.getDelta());
                updateSimulation(dt);
                controls.update();
                renderer.render(scene, camera);
                drawMinimap();
            }
            animate();
        }

        window.onload = init;
    </script>
</body>
